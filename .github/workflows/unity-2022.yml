name: Unity 2022 integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editmode:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Unity 2022.3 EditMode integration tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: tests/Unity2022Project
          unityVersion: 2022.3.54f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: artifacts/unity-test-results
      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-2022-test-results
          path: artifacts/unity-test-results
          if-no-files-found: warn
